name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  verify-version:
    name: Version consistency
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: package.json / Cargo.toml / tauri.conf.json (+ tag)
        run: |
          python3 - <<'PY'
          import json,re,pathlib,os,sys
          pkg=json.load(open("package.json"))["version"]
          tauri=json.load(open("src-tauri/tauri.conf.json"))["version"]
          cargo=re.search(r'^version = "([^"]+)"', pathlib.Path("src-tauri/Cargo.toml").read_text(), re.M).group(1)
          if not (pkg==cargo==tauri):
              sys.exit(f"version mismatch: {pkg} {cargo} {tauri}")
          if os.environ.get("GITHUB_REF_TYPE") == "tag":
              expect="v"+pkg
              ref_name=os.environ.get("GITHUB_REF_NAME", "")
              if ref_name!=expect:
                  sys.exit(f"tag {ref_name} != {expect}")
          PY

  build:
    name: Build and validate all platforms
    needs: verify-version
    permissions:
      contents: read
    uses: ./.github/workflows/build-release.yml
    with:
      fetch_mode: ${{ github.ref_type == 'tag' && 'lock' || 'latest' }}

  publish:
    name: Publish one complete release
    needs: [verify-version, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: downloaded-artifacts

      - name: Validate and flatten all release assets
        run: |
          python3 scripts/prepare-release-assets.py \
            --artifacts-root downloaded-artifacts \
            --project-root . \
            --fetch-mode "${{ github.ref_type == 'tag' && 'lock' || 'latest' }}" \
            --out publish

      - name: Publish stable or rolling nightly
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IS_STABLE: ${{ github.ref_type == 'tag' }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'nightly' }}
        run: |
          set -euo pipefail
          existing=""
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft >release-state.txt 2>/dev/null; then
            existing=$(cat release-state.txt)
          fi
          prune_stale_assets() {
            while IFS= read -r asset; do
              if [ -n "$asset" ] && [ ! -f "publish/$asset" ]; then
                gh release delete-asset "$RELEASE_TAG" "$asset" --yes
              fi
            done < <(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
          }

          if [ "$IS_STABLE" = "true" ]; then
            if [ "$existing" = "false" ]; then
              echo "stable release already published: $RELEASE_TAG" >&2
              exit 1
            fi
            if [ -z "$existing" ]; then
              gh release create "$RELEASE_TAG" --draft --verify-tag --generate-notes \
                --title "yt-dlp GUI $RELEASE_TAG"
            fi
            gh release upload "$RELEASE_TAG" publish/* --clobber
            prune_stale_assets
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false
          else
            if [ -z "$existing" ]; then
              gh release create nightly --draft --prerelease --target "$GITHUB_SHA" \
                --title "yt-dlp GUI nightly" \
                --notes "Rolling main-branch build. Installers bundle yt-dlp and FFmpeg."
            fi
            gh release upload nightly publish/* --clobber
            prune_stale_assets
            gh release edit nightly --draft=false --prerelease=true \
              --target "$GITHUB_SHA" --title "yt-dlp GUI nightly"
          fi
