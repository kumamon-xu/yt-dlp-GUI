name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-version:
    name: Version consistency
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: package.json / Cargo.toml / tauri.conf.json (+ tag)
        run: |
          python3 - <<'PY'
          import json,re,pathlib,os,sys
          pkg=json.load(open("package.json"))["version"]
          tauri=json.load(open("src-tauri/tauri.conf.json"))["version"]
          cargo=re.search(r'^version = "([^"]+)"', pathlib.Path("src-tauri/Cargo.toml").read_text(), re.M).group(1)
          print(pkg, cargo, tauri)
          if not (pkg==cargo==tauri):
              sys.exit("version mismatch")
          ref_type=os.environ.get("GITHUB_REF_TYPE","")
          ref_name=os.environ.get("GITHUB_REF_NAME","")
          if ref_type=="tag":
              expect="v"+pkg
              if ref_name!=expect:
                  sys.exit(f"tag {ref_name} != {expect}")
          PY

  release:
    name: ${{ matrix.name }}
    needs: [verify-version]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            args: ""
            engine_arch: x64
            rust_targets: ""
          - name: Linux x64
            platform: ubuntu-22.04
            args: ""
            engine_arch: x64
            rust_targets: ""
          - name: Linux arm64
            platform: ubuntu-22.04-arm
            args: ""
            engine_arch: arm64
            rust_targets: ""
          - name: macOS Apple Silicon
            platform: macos-latest
            args: "--target aarch64-apple-darwin"
            engine_arch: arm64
            rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - name: macOS Intel
            platform: macos-latest
            args: "--target x86_64-apple-darwin"
            engine_arch: x64
            rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin"

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Linux Tauri deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils xz-utils

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          prefix-key: ${{ matrix.platform }}-${{ matrix.engine_arch }}-${{ matrix.args }}

      - name: Fetch engines (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") { ./scripts/fetch-engines.ps1 -Force -Lock }
          else { ./scripts/fetch-engines.ps1 -Force -Latest }

      - name: Fetch engines (Unix)
        if: runner.os != 'Windows'
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            bash scripts/fetch-engines.sh --force --lock --arch ${{ matrix.engine_arch }}
          else
            bash scripts/fetch-engines.sh --force --latest --arch ${{ matrix.engine_arch }}
          fi

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Frontend tests
        run: pnpm test

      - name: Cargo fmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Build (for smoke)
        run: pnpm tauri build ${{ matrix.args }}

      - name: Smoke bundled engines (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/check-bundled-engines.ps1 -Root src-tauri/target

      - name: Smoke bundled engines (Unix)
        if: runner.os != 'Windows'
        run: bash scripts/check-bundled-engines.sh src-tauri/target

      - name: Publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'nightly' }}
          releaseName: ${{ github.ref_type == 'tag' && format('yt-dlp GUI {0}', github.ref_name) || 'yt-dlp GUI nightly' }}
          releaseBody: |
            Installers with bundled **yt-dlp** and **ffmpeg**.
            安装包已内置 yt-dlp 与 ffmpeg。

            Stable = git tag `v*`. Nightly = `main` (prerelease, rolling).
            稳定版仅由版本 tag 产生，不会被后续 main 覆盖。
          releaseDraft: false
          prerelease: ${{ github.ref_type != 'tag' }}
          generateReleaseNotes: true
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          retryAttempts: 2

      - name: Engines manifest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUNNER_OS: ${{ runner.os }}
        run: |
          MODE=lock
          if [ "${{ github.ref_type }}" != "tag" ]; then MODE=latest; fi
          SLUG=$(echo "${{ matrix.name }}" | tr ' ' '-')
          OUT="engines-manifest-${SLUG}.json"
          if command -v python3 >/dev/null; then PY=python3; else PY=python; fi
          "$PY" scripts/write-engines-manifest.py --out "$OUT" --os "${{ runner.os }}" --arch "${{ matrix.engine_arch }}" --mode "$MODE" --label "${{ matrix.name }}"
          TAG="${{ github.ref_type == 'tag' && github.ref_name || 'nightly' }}"
          gh release upload "$TAG" "$OUT" --clobber
