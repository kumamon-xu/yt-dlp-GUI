name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: typecheck + tests
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Linux Tauri deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Placeholder engines for tauri-build
        run: |
          mkdir -p code
          : > code/yt-dlp
          : > code/ffmpeg
          chmod +x code/yt-dlp code/ffmpeg

      - name: Version consistency
        run: |
          python3 - <<'PY'
          import json,re,pathlib,sys
          pkg=json.load(open("package.json"))["version"]
          tauri=json.load(open("src-tauri/tauri.conf.json"))["version"]
          cargo=re.search(r'^version = "([^"]+)"', pathlib.Path("src-tauri/Cargo.toml").read_text(), re.M).group(1)
          if not (pkg==cargo==tauri):
              sys.exit(f"mismatch {pkg} {cargo} {tauri}")
          PY

      - name: Release script tests
        run: python3 -m unittest scripts/test_prepare_release_assets.py

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Frontend tests
        run: pnpm test

      - name: Cargo fmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml

  cargo-windows:
    name: cargo test (Windows)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - name: Placeholder engines
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path code | Out-Null
          Set-Content -Path code/yt-dlp.exe -Value ""
          Set-Content -Path code/ffmpeg.exe -Value ""
      - name: Cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

  cargo-macos:
    name: cargo check (macOS)
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - name: Placeholder engines
        run: |
          mkdir -p code
          : > code/yt-dlp
          : > code/ffmpeg
          chmod +x code/yt-dlp code/ffmpeg
      - name: Cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets
