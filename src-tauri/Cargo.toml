[package]
name = "yt_dlp_gui"
version = "0.1.0"
description = "A modern GUI for yt-dlp"
authors = ["you"]
edition = "2021"

[lib]
name = "yt_dlp_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["process", "rt", "rt-multi-thread", "macros", "time", "io-util", "sync", "fs"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
